kotlin.code.style=official
# Gradle performance
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M" --enable-native-access=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# Kotlin Multiplatform
kotlin.apple.xcodeCompatibility.nowarn=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.binary.memoryModel=experimental
# Ktor
io.ktor.development=true
# AGP 9 migration bridge:
# keep external Kotlin plugin / legacy DSL behavior temporarily
# to avoid large-scale Kotlin/DSL migration in one step.
android.builtInKotlin=false
android.newDsl=false
