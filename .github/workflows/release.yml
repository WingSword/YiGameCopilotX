name: Build & Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Use official repositories on the GitHub runner
        run: |
          sed -i 's|mirrors.huaweicloud.com/gradle|services.gradle.org/distributions|' gradle/wrapper/gradle-wrapper.properties
          sed -i '\|maven.aliyun.com/repository/|d' settings.gradle.kts

      - name: Test signature verifier compatibility
        run: python3 scripts/test-ci-android-release.py

      - name: Prepare signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python3 scripts/ci-android-release.py prepare

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && github.ref != 'refs/heads/开发分支' }}

      - name: Build Release APK
        run: ./gradlew :composeApp:assembleRelease --no-configuration-cache --console=plain

      - name: Verify release signature and manifest
        run: python3 scripts/ci-android-release.py verify

      - name: Rename APK
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="dev-$(date +%Y%m%d-%H%M%S)"
          fi
          cp "$RELEASE_APK_PATH" "YiGameCopilotX-${TAG}.apk"
          echo "APK_NAME=YiGameCopilotX-${TAG}.apk" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            YiGameCopilotX-*.apk
            release-verification.json
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: YiGameCopilotX-*.apk
          generate_release_notes: true

      - name: Remove temporary signing files
        if: always()
        run: python3 scripts/ci-android-release.py cleanup
