# Put this file inside nginx's http context. Replace the domain and certificate paths.
map $request_method $room_entry_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $room_entry_key zone=room_entry:10m rate=20r/m;
server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8k;
    client_body_timeout 15s;
    location ~ ^/api/v1/admin/ { return 404; }
    location ~ "^/api/v1/rooms(/[0-9]{6}/join)?$" {
        limit_req zone=room_entry burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
    }
    # Unzip the Web release here. HTTPS Web requests /api on the same origin.
    root /opt/yigame/web;
    index index.html;
    include /etc/nginx/mime.types;
    gzip on;
    gzip_types application/wasm application/javascript application/json text/css;
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}
